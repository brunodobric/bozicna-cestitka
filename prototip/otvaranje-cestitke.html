<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Božićna čestitka · prototip otvaranja</title>
<!-- PROTOTIP za novi projekt. Kuverta i njezina animacija su doslovno preuzete iz Kuverte
     (src/components/Envelope.astro, EnvelopeHead.astro i blok "kuverta pri prvom otvaranju" iz src/styles/invitation.css).
     Novo je: božićne boje kuverte, snijeg u pozadini, prikaz čestitke nakon otvaranja s laganim zumom
     i gumb "Spremi kao sliku" (crtanje na canvas + dijeljenje/preuzimanje).
     Otvori datoteku u pregledniku. Fontovi s Google Fonts samo za prototip; u projektu ih poslužuj sam (@fontsource). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Plus+Jakarta+Sans:wght@400;600&display=swap">
<script>
  // = EnvelopeHead.astro: rano dodaje <html class="env"> da čestitka ne bljesne prije kuverte.
  try { document.documentElement.classList.add('env'); } catch (e) {}
</script>
<style>
/* ---------- božićna paleta (u Kuverti ove varijable dolaze iz teme) ---------- */
.inv {
  --bg: #0f2e22;            /* tamnozelena pozadina */
  --surface: #fffaf0;       /* papir kartice */
  --text: #2a211c;
  --muted: #7a6a58;
  --accent: #b8892f;        /* zlato */
  --accent-ink: #8a6420;
  --border: #e6d9bf;
  --focus: #e8c77a;
  --font-head: 'EB Garamond', 'Times New Roman', serif;
  --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
  --head-weight: 400;
}
html, body { margin: 0; }
body { background: #0f2e22; color: #f4ead6; font: 400 16px/1.6 'Plus Jakarta Sans', system-ui, sans-serif; }

/* ===== ISPOD JE ORIGINALNI CSS KUVERTE IZ KUVERTE (invitation.css), BEZ IZMJENA ===== */
.inv {
  --env-back: color-mix(in srgb, var(--accent) 34%, var(--bg));
  --env-front: color-mix(in srgb, var(--accent) 11%, var(--surface));
  --env-flap: color-mix(in srgb, var(--accent) 15%, var(--surface));
  --env-line: color-mix(in srgb, var(--accent) 40%, transparent);
  --env-liner: color-mix(in srgb, var(--accent) 62%, var(--bg)); /* unutarnja strana zaklopca */
  --env-seal: var(--accent);
  --env-seal-ink: #ffffff;
}
html.env,
html.env body {
  overflow: hidden;
}
/* dok je kuverta zatvorena, naslovni dio čeka sa svojom animacijom */
html.env .inv-hero *,
html.env .inv-hero *::before,
html.env .inv-hero *::after {
  animation-play-state: paused !important;
}
.inv-env {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.75rem;
  padding: 1.5rem var(--gutter) 4.5rem;
  overflow: hidden;
  background:
    radial-gradient(ellipse 85% 60% at 50% 44%, color-mix(in srgb, var(--accent) 9%, var(--bg)) 0%, var(--bg) 72%),
    var(--bg);
  transition: opacity 0.65s ease;
}
html:not(.env) .inv-env:not(.is-gone) {
  display: none;
}
.inv-env.is-gone {
  opacity: 0;
  pointer-events: none;
}
.inv-env__open {
  display: block;
  padding: 0;
  margin: 0;
  border: 0;
  background: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  animation: inv-env-in 1s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
.inv-env__open:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 12px;
}
@keyframes inv-env-in {
  from {
    opacity: 0;
    transform: translateY(18px) scale(0.96);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
.inv-env__stage {
  position: relative;
  display: block;
  animation: inv-env-float 3.6s ease-in-out 1s infinite;
}
.inv-env.is-open .inv-env__stage {
  animation: none;
}
@keyframes inv-env-float {
  0%,
  100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-7px);
  }
}
/* sjena na podlozi: diše suprotno od kuverte */
.inv-env__ground {
  position: absolute;
  left: 8%;
  right: 8%;
  bottom: -1.9rem;
  height: 1.1rem;
  border-radius: 50%;
  background: color-mix(in srgb, var(--text) 30%, transparent);
  filter: blur(11px);
  opacity: 0.55;
  animation: inv-env-ground 3.6s ease-in-out 1s infinite;
  transition: opacity 0.4s ease;
}
@keyframes inv-env-ground {
  0%,
  100% {
    transform: scaleX(1);
    opacity: 0.55;
  }
  50% {
    transform: scaleX(0.9);
    opacity: 0.38;
  }
}
.inv-env.is-open .inv-env__ground {
  animation: none;
}
.inv-env__envelope {
  position: relative;
  display: block;
  width: min(86vw, 400px, 62vh); /* 62vh: na položenom mobitelu ostaje mjesta za karticu i uputu */
  aspect-ratio: 3 / 2;
  perspective: 1100px;
  filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.07)) drop-shadow(0 16px 26px rgba(0, 0, 0, 0.1));
}
.inv-env__back {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: linear-gradient(to bottom, color-mix(in srgb, var(--env-back) 82%, #000) 0%, var(--env-back) 55%);
  border-radius: 4px;
}
.inv-env__card {
  position: absolute;
  left: 6%;
  right: 6%;
  top: 5%;
  bottom: 5%;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 0.4rem;
  padding: 10% 8% 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text);
  text-align: center;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
  transform-origin: 50% 30%;
  transition: transform 0.85s cubic-bezier(0.2, 0.75, 0.2, 1) 0.85s;
}
.inv-env__card > * {
  transition: opacity 0.3s ease;
}
.inv-env__card-kicker {
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--accent-ink);
}
.inv-env__card-names {
  font-family: var(--font-head);
  font-weight: var(--head-weight);
  font-size: clamp(1.25rem, 6vw, 1.75rem);
  line-height: 1.15;
  letter-spacing: var(--head-tracking);
  text-transform: var(--head-transform);
  overflow-wrap: anywhere;
}
.inv-env__card-date {
  font-family: var(--font-body);
  font-size: 0.6875rem;
  letter-spacing: 0.06em;
  color: var(--muted);
}
.inv-env__front {
  position: absolute;
  inset: 0;
  z-index: 3;
  width: 100%;
  height: 100%;
  overflow: visible;
  border-radius: 4px;
}
/* bočni preklopi su malo tamniji od donjeg, pa se vidi da je papir presavijen */
.inv-env__side {
  fill: color-mix(in srgb, var(--env-front) 96%, #000);
}
.inv-env__bottom {
  fill: var(--env-front);
}
.inv-env__fold {
  fill: none;
  stroke: var(--env-line);
  stroke-width: 1;
  vector-effect: non-scaling-stroke;
}
.inv-env__deco {
  display: none;
}
.inv-env__front,
.inv-env__back,
.inv-env__deco,
.inv-env__flap,
.inv-env__flap-shadow,
.inv-env__seal {
  transition-property: opacity;
  transition-duration: 0.4s;
  transition-timing-function: ease;
}
/* sjena zaklopca na tijelu kuverte; nestane kad se zaklopac podigne */
.inv-env__flap-shadow {
  position: absolute;
  left: 0;
  right: 0;
  top: 3%;
  z-index: 3;
  display: block;
  height: 60%;
  filter: blur(5px);
  opacity: 0.16;
  pointer-events: none;
}
.inv-env__flap-shadow span {
  display: block;
  width: 100%;
  height: 100%;
  background: #000;
  clip-path: polygon(3% 0, 97% 0, 50% 98.3%);
}
.inv-env__flap {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  z-index: 4;
  display: block;
  height: 60%;
  transform-origin: 50% 0;
  transform-style: preserve-3d;
  transition:
    transform 0.8s cubic-bezier(0.5, 0, 0.2, 1) 0.3s,
    z-index 0s linear 0.7s,
    opacity 0.4s ease;
}
.inv-env__flap-face {
  position: absolute;
  inset: 0;
  display: block;
  clip-path: polygon(0 0, 100% 0, 50% 98.3%);
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}
.inv-env__flap-face--out {
  background:
    linear-gradient(to bottom, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0) 45%, rgba(0, 0, 0, 0.035) 100%),
    var(--env-flap);
}
/* unutarnja strana (podstava): vidi se kad se zaklopac otvori; trokut je zrcaljen jer je lice okrenuto */
.inv-env__flap-face--in {
  clip-path: polygon(0 100%, 100% 100%, 50% 1.7%);
  transform: rotateX(180deg);
  background: var(--env-liner);
}
.inv-env__flap svg {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
.inv-env__flap-edge {
  fill: none;
  stroke: var(--env-line);
  stroke-width: 1;
  vector-effect: non-scaling-stroke;
}
/* voštani pečat: nepravilan rub, utisnut krug s inicijalima */
.inv-env__seal {
  position: absolute;
  left: 50%;
  top: 59%;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 3.75rem;
  height: 3.75rem;
  transform: translate(-50%, -50%);
  border-radius: 47% 53% 51% 49% / 52% 47% 53% 48%;
  background: radial-gradient(
    circle at 34% 28%,
    color-mix(in srgb, var(--env-seal) 72%, #fff) 0%,
    var(--env-seal) 48%,
    color-mix(in srgb, var(--env-seal) 76%, #000) 100%
  );
  color: var(--env-seal-ink);
  font-family: var(--font-head);
  font-size: 1.0625rem;
  letter-spacing: 0.04em;
  box-shadow:
    0 1px 1px rgba(0, 0, 0, 0.25),
    0 5px 10px -3px rgba(0, 0, 0, 0.35);
}
.inv-env__seal::before {
  content: '';
  position: absolute;
  inset: 0.5rem;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 32%, color-mix(in srgb, var(--env-seal) 88%, #fff), var(--env-seal) 70%);
  box-shadow:
    inset 0 1px 2px rgba(0, 0, 0, 0.4),
    0 1px 0 rgba(255, 255, 255, 0.22);
}
/* krug koji se širi oko pečata i poziva na dodir */
.inv-env__seal::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 50%;
  border: 1px solid var(--env-seal);
  opacity: 0;
  animation: inv-env-ring 2.6s ease-out 1.6s infinite;
}
@keyframes inv-env-ring {
  0% {
    transform: scale(1);
    opacity: 0.55;
  }
  70%,
  100% {
    transform: scale(1.75);
    opacity: 0;
  }
}
.inv-env__seal-text {
  position: relative;
  text-shadow: 0 1px 1px rgba(0, 0, 0, 0.25);
}

/* otvaranje: pečat → zaklopac → kartica */
.inv-env.is-open .inv-env__seal {
  animation: inv-env-seal 0.5s ease forwards;
}
.inv-env.is-open .inv-env__seal::after {
  animation: none;
}
@keyframes inv-env-seal {
  0% {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }
  28% {
    transform: translate(-50%, -50%) scale(0.88);
    opacity: 1;
  }
  100% {
    transform: translate(-50%, -20%) scale(1.2) rotate(10deg);
    opacity: 0;
  }
}
.inv-env.is-open .inv-env__flap {
  transform: rotateX(180deg);
  z-index: 1;
}
.inv-env.is-open .inv-env__flap-shadow {
  opacity: 0;
  transition-delay: 0.3s;
}
.inv-env.is-open .inv-env__card {
  transform: translateY(-60%);
}
/* završetak: kuverta nestaje, kartica naraste preko ekrana i postane pozivnica */
.inv-env.is-zoom .inv-env__front,
.inv-env.is-zoom .inv-env__back,
.inv-env.is-zoom .inv-env__deco,
.inv-env.is-zoom .inv-env__flap,
.inv-env.is-zoom .inv-env__ground {
  opacity: 0;
}
.inv-env.is-zoom .inv-env__envelope {
  filter: none;
}
.inv-env.is-zoom .inv-env__card {
  transform: translateY(-20%) scale(5);
  border-color: transparent;
  outline-color: transparent;
  box-shadow: none;
  background: var(--bg);
  transition:
    transform 0.75s cubic-bezier(0.6, 0, 0.3, 1),
    background-color 0.5s ease,
    border-color 0.2s ease,
    outline-color 0.2s ease;
}
.inv-env.is-zoom .inv-env__card > * {
  opacity: 0;
}

.inv-env__hint {
  margin: 0;
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent-ink);
  opacity: 0;
  transform: translateY(6px);
  transition:
    opacity 0.6s ease,
    transform 0.6s ease;
}
.inv-env.is-hinting .inv-env__hint {
  opacity: 1;
  transform: none;
}
.inv-env.is-open .inv-env__hint {
  opacity: 0;
  transition-duration: 0.25s;
}
.inv-env__skip {
  position: absolute;
  bottom: max(1.25rem, env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  min-height: 44px;
  padding: 0.5rem 1rem;
  border: 0;
  background: none;
  color: var(--muted);
  font: inherit;
  font-size: 0.8125rem;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
  transition: opacity 0.25s ease;
}
.inv-env.is-open .inv-env__skip {
  opacity: 0;
}

/* prebacivanje jezika (HR / EN) */

/* ===== KRAJ ORIGINALNOG CSS-a ===== */

/* božićne boje kuverte: zadane vrijednosti iz originala računaju se iz naglaska, ovdje ih postavljamo izravno */
.inv {
  --env-back: #6e1218;
  --env-front: #a31f28;
  --env-flap: #b2242d;
  --env-line: rgba(240, 205, 130, 0.55);
  --env-liner: #1d5a3c;
  --env-seal: #c99a3e;
  --env-seal-ink: #5b1015;
}
.inv-env__flap-face--in { /* podstava: zelena s tankim zlatnim prugama (kao Klasik) */
  background: repeating-linear-gradient(135deg, var(--env-liner) 0 7px, #c99a3e 7px 8px);
}
.inv-env__card { border-color: var(--accent); outline: 1px solid rgba(184,137,47,.45); outline-offset: -6px; }
.inv-env__card-names { font-style: italic; }
.inv-env__hint, .inv-env__skip { color: #f1e3c4; }
.inv-env__seal-text { font-size: 1.35rem; }
.inv-env { background: radial-gradient(ellipse 85% 60% at 50% 44%, #1a4a37 0%, #0f2e22 72%); }

/* snijeg (čisti CSS, isključen uz smanjenje animacija) */
.snijeg { position: fixed; inset: 0; pointer-events: none; z-index: 2147483647; overflow: hidden; }
.snijeg i { position: absolute; top: -12px; width: 6px; height: 6px; border-radius: 50%; background: #fff; opacity: .75; animation: pada linear infinite; }
@keyframes pada { to { transform: translate3d(var(--dx, 20px), 105vh, 0); } }
@media (prefers-reduced-motion: reduce) { .snijeg { display: none; } }

/* ---------- čestitka nakon otvaranja ---------- */
.cest { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.25rem;
  padding: 2rem max(16px, env(safe-area-inset-right)) calc(2rem + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  background: radial-gradient(ellipse 85% 60% at 50% 44%, #1a4a37 0%, #0f2e22 72%); }
.karta { width: min(92vw, 460px); background: #fffaf0; color: #2a211c; border: 1px solid #b8892f; outline: 1px solid rgba(184,137,47,.45);
  outline-offset: -8px; border-radius: 3px; box-shadow: 0 20px 50px rgba(0,0,0,.35); overflow: hidden; }
html.env .karta { opacity: 0; }
.karta.is-in { animation: zum 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
@keyframes zum { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .karta.is-in { animation: none; } }
.karta img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.karta__tekst { padding: 1.5rem 1.75rem 1.75rem; text-align: center; }
.karta__naslov { font: italic 400 2rem/1.15 'EB Garamond', serif; color: #8a1c24; margin: 0 0 .75rem; }
.karta__poruka { font: 400 1.125rem/1.55 'EB Garamond', serif; white-space: pre-line; margin: 0 0 1rem; }
.karta__potpis { font: italic 400 1.25rem/1.3 'EB Garamond', serif; color: #8a6420; margin: 0; }
.gumbi { display: flex; gap: .75rem; flex-wrap: wrap; justify-content: center; }
.gumb { min-height: 44px; padding: .6rem 1.25rem; border-radius: 999px; border: 1px solid #c99a3e; background: #c99a3e; color: #2a1a08;
  font: 600 .9375rem/1 'Plus Jakarta Sans', sans-serif; cursor: pointer; }
.gumb--sporedni { background: transparent; color: #f1e3c4; }
.napomena { font-size: .8125rem; color: #cdbf9f; text-align: center; max-width: 40ch; margin: 0; }
</style>
</head>
<body class="inv">

<!-- = Envelope.astro (tekstovi za čestitku) -->
<div class="inv-env" id="kuverta" data-key="" role="dialog" aria-modal="true" aria-label="Čestitka u kuverti">
  <button type="button" class="inv-env__open" aria-label="Otvori čestitku">
    <span class="inv-env__stage" aria-hidden="true">
      <span class="inv-env__envelope">
        <span class="inv-env__back"></span>
        <span class="inv-env__card">
          <span class="inv-env__card-kicker">Sretan Božić</span>
          <span class="inv-env__card-names">za Anu</span>
          <span class="inv-env__card-date">od Marka</span>
        </span>
        <svg class="inv-env__front" viewBox="0 0 300 200" preserveAspectRatio="none" focusable="false">
          <path class="inv-env__side" d="M0 0 L150 112 L0 200 Z"></path>
          <path class="inv-env__side" d="M300 0 L150 112 L300 200 Z"></path>

    <img id="slika" alt="" crossorigin="anonymous" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300'%3E%3Crect width='400' height='300' fill='%231d5a3c'/%3E%3Cpath d='M200 40 L270 240 H130 Z' fill='%23336f4f'/%3E%3Ccircle cx='200' cy='40' r='10' fill='%23e8c77a'/%3E%3Crect x='188' y='240' width='24' height='30' fill='%236b4423'/%3E%3C/svg%3E">

Vidimo se za Novu godinu.</p>

<script>
  // snijeg
  (function () {
    var s = document.querySelector('.snijeg');
    for (var i = 0; i < 40; i++) {
      var f = document.createElement('i');
      var size = 2 + Math.random() * 5;
      f.style.left = Math.random() * 100 + 'vw';
      f.style.width = f.style.height = size + 'px';
      f.style.opacity = (0.35 + Math.random() * 0.5).toFixed(2);
      f.style.animationDuration = (7 + Math.random() * 9).toFixed(1) + 's';
      f.style.animationDelay = (-Math.random() * 14).toFixed(1) + 's';
      f.style.setProperty('--dx', (Math.random() * 60 - 30).toFixed(0) + 'px');
      s.appendChild(f);
    }
  })();
</script>

<script>
  // = skripta iz Envelope.astro (doslovno), uz jednu dopunu: na kraju pokreće zum čestitke.
  (function () {
    var root = document.documentElement;
    var el = document.getElementById('kuverta');
    if (!el) return;
    window.__envReady = true;
    if (!root.classList.contains('env')) { el.remove(); return; }
    var key = el.getAttribute('data-key');
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var done = false;
    var hint = setTimeout(function () { el.classList.add('is-hinting'); }, 1800);
    function remember() { if (!key) return; try { localStorage.setItem('cestitka-kuverta:' + key, '1'); } catch (e) {} }
    function finish() {
      el.classList.add('is-gone');
      root.classList.remove('env');
      document.dispatchEvent(new Event('mwi:env-open'));
      setTimeout(function () { el.remove(); }, reduced ? 200 : 700);
    }
    function open(animate) {
      if (done) return;
      done = true;
      clearTimeout(hint);
      remember();
      if (animate && !reduced) {
        el.classList.add('is-open');
        setTimeout(function () { el.classList.add('is-zoom'); }, 1750);
        setTimeout(finish, 2300);
      } else { finish(); }
    }
    el.addEventListener('click', function (e) { open(!e.target.closest('.inv-env__skip')); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') open(false); });
  })();
  // NOVO: kad se kuverta makne, čestitka "doleti" i malo se zumira.
  document.addEventListener('mwi:env-open', function () { document.getElementById('karta').classList.add('is-in'); }, { once: true });
  document.getElementById('ponovi').addEventListener('click', function () { location.reload(); });
</script>

<script>
  // NOVO: "Spremi kao sliku". Čestitka se crta na canvas (1080 × 1350, format za mobitel i Instagram),
  // ne fotografira se HTML (html2canvas i slični su nepouzdani na iOS Safariju s fontovima i slikama).
  // Na mobitelu: Web Share s datotekom → korisnik odabere "Spremi sliku" i slika ide u galeriju.
  // Inače: preuzimanje PNG-a.
  (function () {
    var W = 1080, H = 1350;
    function wrap(ctx, text, maxW) {
      var out = [];
      text.split('\n').forEach(function (para) {
        var words = para.split(/\s+/), line = '';
        words.forEach(function (w) {
          var t = line ? line + ' ' + w : w;
          if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t;
        });
        out.push(line);
      });
      return out;
    }
    async function nacrtaj() {
      await document.fonts.ready;
      var c = document.createElement('canvas'); c.width = W; c.height = H;
      var ctx = c.getContext('2d');
      // pozadina
      var g = ctx.createRadialGradient(W / 2, H * 0.44, 50, W / 2, H * 0.44, H * 0.8);
      g.addColorStop(0, '#1a4a37'); g.addColorStop(1, '#0f2e22');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      // kartica
      var m = 70, cw = W - 2 * m, ch = H - 2 * m;
      ctx.fillStyle = '#fffaf0'; ctx.fillRect(m, m, cw, ch);
      ctx.strokeStyle = '#b8892f'; ctx.lineWidth = 2; ctx.strokeRect(m, m, cw, ch);
      ctx.strokeStyle = 'rgba(184,137,47,.45)'; ctx.strokeRect(m + 16, m + 16, cw - 32, ch - 32);
      // slika (object-fit: cover)
      var img = document.getElementById('slika');
      var ih = Math.round(cw * 0.62);
      if (img.complete && img.naturalWidth) {
        var r = Math.max(cw / img.naturalWidth, ih / img.naturalHeight);
        var sw = cw / r, sh = ih / r;
        ctx.drawImage(img, (img.naturalWidth - sw) / 2, (img.naturalHeight - sh) / 2, sw, sh, m, m, cw, ih);
      }
      // tekst
      ctx.textAlign = 'center';
      var y = m + ih + 110;
      ctx.fillStyle = '#8a1c24'; ctx.font = 'italic 400 76px "EB Garamond"';
      ctx.fillText('Sretan Božić', W / 2, y);
      ctx.fillStyle = '#2a211c'; ctx.font = '400 40px "EB Garamond"';
      var lines = wrap(ctx, document.getElementById('poruka').textContent.trim(), cw - 140);
      y += 80;
      lines.slice(0, 9).forEach(function (l) { ctx.fillText(l, W / 2, y); y += 54; });
      ctx.fillStyle = '#8a6420'; ctx.font = 'italic 400 46px "EB Garamond"';
      ctx.fillText(document.getElementById('potpis').textContent.trim(), W / 2, Math.min(y + 30, m + ch - 50));
      return new Promise(function (res) { c.toBlob(res, 'image/png'); });
    }
    document.getElementById('spremi').addEventListener('click', async function () {
      var blob = await nacrtaj();
      if (!blob) return;
      var file = new File([blob], 'bozicna-cestitka.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: 'Božićna čestitka' }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
      }
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = file.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
    });
  })();
</script>
